<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Hookline Legends</title>
  </head>
  <body class="app">
    <div class="hero-radial"></div>
    <section class="card">
      <p class="eyebrow">Daily Community Puzzle</p>
      <h1 class="title" id="title">Hookline Legends</h1>
      <p class="description" id="daily-brief">
        Chain all route nodes in order before hazard waves jam your path.
      </p>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="stat-streak">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Runs Left</span>
          <span class="stat-value" id="stat-runs">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="stat-best">-</span>
        </div>
      </div>

      <div class="board" id="board-preview">Loading leaderboard...</div>

      <div class="actions">
        <button class="start-button" id="start-button">Open Arena</button>
      </div>

      <p class="mutator" id="mutator-text"></p>
    </section>

    <div class="footer-links">
      <div class="docs-link" tabindex="0" id="docs-link">Devvit Docs</div>
      <div class="docs-link" tabindex="0" id="playtest-link">r/GamesOnReddit</div>
      <div class="docs-link" tabindex="0" id="discord-link">Discord</div>
    </div>

    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
